name: Validate content
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          bundler: '2.2.19'
      - name: Check content
        run: ruby scripts/check_content.rb
      - name: Build
        run: bundle exec jekyll build
      - name: Check generated pages
        run: python3 scripts/check_site.py _site
